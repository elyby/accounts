version: '3.4'
services:
  web:
    image: elyby/accounts/nginx:local
    build:
      context: .
      target: web
      args:
        build_env: dev
    depends_on:
      - app
      - emails-renderer
    env_file: .env
    ports:
      - 80:80
    volumes:
      - ./:/var/www/html

  app:
    image: elyby/accounts:local
    build:
      context: .
      target: app
      args:
        build_env: dev
    depends_on:
      - db
      - redis
    volumes:
      - ./:/var/www/html
    env_file: .env
    networks:
      default:
        aliases:
          - php

  worker:
    image: elyby/accounts:local
    build:
      context: .
      target: app
      args:
        build_env: dev
    command: ['php', 'yii', 'queue/listen', '-v']
    depends_on:
      - db
      - redis
    volumes:
      - ./:/var/www/html
    env_file: .env

  cron:
    image: elyby/accounts:local
    build:
      context: .
      target: app
      args:
        build_env: dev
    command: ['crond', '-s', '/etc/cron.d', '-f', '-L', '/var/log/cron.log']
    stop_signal: SIGKILL
    depends_on:
      - db
      - redis
    volumes:
      - ./:/var/www/html
    env_file: .env

  emails-renderer:
    image: ghcr.io/elyby/emails-renderer:latest

  db:
    image: bitnamilegacy/mariadb:10.6-debian-11
    volumes:
      - ./data/mariadb:/bitnami/mariadb
      - ./docker/mariadb/config.cnf:/opt/bitnami/mariadb/conf/my_custom.cnf:ro
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
      MARIADB_ROOT_PASSWORD: ""
      MARIADB_DATABASE: ely_accounts
      MARIADB_USER: ely_accounts_user
      MARIADB_PASSWORD: ely_accounts_password

  redis:
    image: redis:5.0-alpine
    volumes:
      - ./data/redis:/data

  phpmyadmin:
    build: ./docker/phpmyadmin
    environment:
      - PMA_ARBITRARY=1
      - PMA_USER=root
      - PMA_PASSWORD=
    depends_on:
      - db
    ports:
      - 8080:80
